[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project]
name = "rag-sn-in"
version = "0.1.0"
description = "Railway Regulatory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "qdrant-client",
    "pypdf",
    "python-dotenv",
    "pymupdf>=1.28.0",
    "docling>=2.115.0",
    "transformers>=4.56.2,<5",
    "sentencepiece>=0.2.2",
    "huggingface-hub>=0.24,<1",
    "tqdm>=4.69.1",
    "torch",
    "langchain-ollama",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-chroma>=1.1.0",
    "onnxruntime>=1.19,<1.24",
    "sentence-transformers>=5.6.1",
    "ragas<0.4",
    "pandas>=2.3.3",
    "datasets>=5.0.1",
    "langchain-deepseek>=1.1.0",
    "langchain-google-vertexai>=3.2.4",
    "langfuse>=4.14.3",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[tool.setuptools.packages.find]
where = ["src"]
