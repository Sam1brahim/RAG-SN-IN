[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-sn-in"
version = "0.1.0"
description = "Railway Regulatory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "qdrant-client",
    "pypdf",
    "python-dotenv",
    "pymupdf>=1.28.0",
    "docling>=2.115.0",
]

[tool.setuptools.packages.find]
where = ["src"]
