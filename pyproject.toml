[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project]
name = "rag-sn-in"
version = "0.1.0"
description = "Railway Regulatory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "qdrant-client",
    "pypdf",
    "python-dotenv",
    "pymupdf>=1.28.0",
    "docling>=2.115.0",
    "transformers>=5.8.1",
    "sentencepiece>=0.2.2",
    "huggingface-hub>=1.24.0",
    "tqdm>=4.69.1",
    "torch"
]

[tool.setuptools.packages.find]
where = ["src"]
