[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project]
name = "rag-sn-in"
version = "0.1.0"
description = "Railway Regulatory Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core",
    "langchain-openai",
    "qdrant-client",
    "pypdf",
    "python-dotenv",
    "pymupdf>=1.28.0",
    "docling>=2.115.0",
    "transformers>=5.8.1",
    "sentencepiece>=0.2.2",
    "huggingface-hub>=1.24.0",
    "tqdm>=4.69.1",
    "torch",
    "langchain-ollama",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-chroma>=1.1.0",
    "onnxruntime>=1.19,<1.24",
    "sentence-transformers>=5.6.1",
    "flagembedding>=1.4.0",
]

[tool.setuptools.packages.find]
where = ["src"]
